name: Daily Briefing

on:
  schedule:
    # 00:00 UTC = 08:00 AM MYT (Morning Briefing)
    - cron: '0 0 * * *'
    # 11:00 UTC = 19:00 PM MYT (Evening Pre-Market Alert)
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run update script
        run: python scripts/update_briefing.py
